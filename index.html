<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<title>OverlayForge — конструктор оверлеев для стрима</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a12;
    --bg-2: #0e0e18;
    --surface: rgba(24, 24, 36, 0.75);
    --surface-2: rgba(255, 255, 255, 0.03);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #f5f5fa;
    --text-dim: #9a9ab0;
    --text-mute: #5f5f78;
    --accent: #9147ff;
    --accent-2: #b380ff;
    --pink: #ff5c8a;
    --green: #4ade80;
    --yellow: #fbbf24;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60% 50% at 20% 0%, rgba(145, 71, 255, 0.15), transparent 60%),
      radial-gradient(ellipse 50% 40% at 90% 100%, rgba(255, 92, 138, 0.08), transparent 60%);
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 30%, transparent 90%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 30%, transparent 90%);
  }

  /* ШАПКА */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: linear-gradient(135deg, #9147ff, #ff5c8a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    box-shadow: 0 4px 16px rgba(145, 71, 255, 0.5);
  }

  .brand-text {
    display: flex;
    flex-direction: column;
  }

  .brand-name {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .brand-sub {
    font-size: 0.68rem;
    color: var(--text-mute);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
  }

  .topbar-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 8px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.06);
    border-color: var(--border-strong);
    color: var(--text);
    transform: translateY(-1px);
  }

  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn.primary {
    background: linear-gradient(135deg, #9147ff, #a970ff);
    color: #fff;
    border: none;
    box-shadow: 0 4px 16px rgba(145, 71, 255, 0.4);
  }

  .btn.primary:hover:not(:disabled) {
    box-shadow: 0 6px 24px rgba(145, 71, 255, 0.55);
    color: #fff;
  }

  .btn.ghost { background: transparent; }

  /* ОСНОВНОЙ LAYOUT */
  .app {
    display: grid;
    grid-template-columns: 260px 1fr 300px;
    gap: 12px;
    flex: 1;
    min-height: 0;
  }

  /* ЛЕВАЯ ПАНЕЛЬ — элементы */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
  }

  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 100px;
  }

  .panel-title {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-mute);
    padding: 4px 0 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-title .badge {
    font-size: 0.65rem;
    padding: 2px 7px;
    background: rgba(145, 71, 255, 0.15);
    color: var(--accent-2);
    border-radius: 100px;
    text-transform: none;
    letter-spacing: 0.02em;
  }

  .element-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .element-btn {
    padding: 10px 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.68rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-align: center;
    line-height: 1.15;
  }

  .element-btn .icon { font-size: 1.1rem; }

  .element-btn:hover {
    background: rgba(145, 71, 255, 0.08);
    border-color: rgba(145, 71, 255, 0.3);
    color: var(--text);
    transform: translateY(-2px);
  }

  .element-btn:active { transform: scale(0.97); }

  /* ЦЕНТР — редактор */
  .editor {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }

  .editor-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    flex-wrap: wrap;
  }

  .toolbar-group {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-right: 8px;
    margin-right: 4px;
    border-right: 1px solid var(--border);
  }

  .toolbar-group:last-child { border-right: none; padding-right: 0; margin-right: 0; }

  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .icon-btn:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    border-color: var(--border-strong);
  }

  .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .icon-btn.active {
    background: rgba(145, 71, 255, 0.2);
    border-color: var(--accent);
    color: var(--accent-2);
  }

  .zoom-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-dim);
    min-width: 48px;
    text-align: center;
  }

  .canvas-area {
    flex: 1;
    background: #08080e;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 300px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
  }

  .canvas-area::-webkit-scrollbar { width: 8px; height: 8px; }
  .canvas-area::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 100px;
  }

  .canvas-wrap {
    position: relative;
    transform-origin: center center;
    transition: transform 0.15s ease;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    flex-shrink: 0;
  }

  #overlayCanvas {
    display: block;
    background: repeating-conic-gradient(#1a1a24 0% 25%, #14141c 0% 50%) 50% / 24px 24px;
    cursor: default;
  }

  /* ПРАВАЯ ПАНЕЛЬ — свойства */
  .properties {
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
  }

  .properties::-webkit-scrollbar { width: 6px; }
  .properties::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 100px;
  }

  .prop-section {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .prop-section:last-child { border-bottom: none; }

  .prop-title {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-mute);
    margin-bottom: 10px;
  }

  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 10px;
  }

  .slider-row:last-child { margin-bottom: 0; }

  .slider-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .slider-label .val {
    color: var(--accent-2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 100px;
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #9147ff, #b380ff);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(145, 71, 255, 0.5);
    border: 2px solid var(--bg);
  }

  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: 2px solid var(--bg);
    border-radius: 50%;
    background: linear-gradient(135deg, #9147ff, #b380ff);
    cursor: pointer;
  }

  .color-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .color-row:last-child { margin-bottom: 0; }

  .color-row label {
    font-size: 0.75rem;
    color: var(--text-dim);
    flex: 1;
  }

  input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 40px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    padding: 2px;
    flex-shrink: 0;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
  input[type="color"]::-moz-color-swatch { border: none; border-radius: 4px; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 0.78rem;
    color: var(--text-dim);
    gap: 8px;
  }

  .toggle-label { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .toggle-label small { font-size: 0.65rem; color: var(--text-mute); }

  .switch {
    position: relative;
    width: 36px;
    height: 20px;
    flex-shrink: 0;
  }

  .switch input { opacity: 0; width: 0; height: 0; }

  .switch-slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--border);
    border-radius: 100px;
    transition: all 0.25s;
  }

  .switch-slider::before {
    content: '';
    position: absolute;
    height: 12px;
    width: 12px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.25s;
  }

  .switch input:checked + .switch-slider {
    background: linear-gradient(135deg, #9147ff, #a970ff);
    border-color: transparent;
  }

  .switch input:checked + .switch-slider::before {
    transform: translateX(16px);
  }

  .text-input {
    width: 100%;
    padding: 8px 10px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.82rem;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 6px;
  }

  .text-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(145, 71, 255, 0.15);
  }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-mute);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .empty-state .big { font-size: 2rem; opacity: 0.5; }

  /* Слои */
  .layers-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 260px;
    overflow-y: auto;
  }

  .layer-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 9px;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .layer-item:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: var(--border-strong);
    color: var(--text);
  }

  .layer-item.active {
    background: rgba(145, 71, 255, 0.15);
    border-color: var(--accent);
    color: var(--text);
  }

  .layer-icon { font-size: 0.9rem; flex-shrink: 0; }
  .layer-name {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .layer-vis {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.04);
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    flex-shrink: 0;
  }

  .layer-vis:hover { background: rgba(255, 255, 255, 0.1); color: var(--text); }

  /* Статус */
  #status {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    padding: 10px 18px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 100px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    font-size: 0.82rem;
    color: var(--text);
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    z-index: 100;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    max-width: 90vw;
    text-align: center;
  }

  #status.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  #status.success { border-color: rgba(74, 222, 128, 0.5); color: var(--green); }
  #status.error { border-color: rgba(255, 92, 138, 0.5); color: #ff8fa3; }

  /* Пресеты размеров */
  .preset-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    margin-bottom: 10px;
  }

  .preset-btn {
    padding: 7px 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-mute);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .preset-btn:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
  }

  .preset-btn.active {
    background: rgba(145, 71, 255, 0.2);
    border-color: var(--accent);
    color: var(--accent-2);
  }

  /* Адаптация */
  @media (max-width: 1100px) {
    .app { grid-template-columns: 220px 1fr 260px; }
  }

  @media (max-width: 900px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto;
    }
    .panel, .properties { max-height: 300px; }
    .canvas-area { min-height: 400px; }
  }

  @media (max-width: 480px) {
    body { padding: 10px; padding-top: max(10px, env(safe-area-inset-top)); }
    .topbar { padding: 8px 12px; gap: 10px; }
    .brand-name { font-size: 0.85rem; }
    .brand-sub { display: none; }
    .btn { padding: 6px 10px; font-size: 0.72rem; }
    .element-list { grid-template-columns: 1fr 1fr 1fr; }
    .icon-btn { width: 28px; height: 28px; font-size: 0.78rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="bg-grid"></div>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">⚒️</div>
    <div class="brand-text">
      <div class="brand-name">OverlayForge</div>
      <div class="brand-sub">overlay builder v1.0</div>
    </div>
  </div>
  <div class="topbar-actions">
    <button type="button" class="btn ghost" id="btnUndo" title="Ctrl+Z">↶ Отменить</button>
    <button type="button" class="btn ghost" id="btnRedo" title="Ctrl+Y">↷ Повторить</button>
    <button type="button" class="btn" id="btnImport">📂 Загрузить</button>
    <button type="button" class="btn" id="btnExport">💾 Сохранить</button>
    <button type="button" class="btn primary" id="btnDownload">⬇ Скачать PNG</button>
  </div>
</div>

<div class="app">

  <!-- ЛЕВАЯ ПАНЕЛЬ -->
  <div class="panel">
    <div class="panel-title">Элементы <span class="badge">нажми чтобы добавить</span></div>
    <div class="element-list">
      <button type="button" class="element-btn" data-add="webcam">
        <span class="icon">📹</span>
        <span>Веб-камера</span>
      </button>
      <button type="button" class="element-btn" data-add="chat">
        <span class="icon">💬</span>
        <span>Чат</span>
      </button>
      <button type="button" class="element-btn" data-add="alert">
        <span class="icon">🔔</span>
        <span>Алерт</span>
      </button>
      <button type="button" class="element-btn" data-add="goal">
        <span class="icon">🎯</span>
        <span>Цель</span>
      </button>
      <button type="button" class="element-btn" data-add="counter">
        <span class="icon">🔢</span>
        <span>Счётчик</span>
      </button>
      <button type="button" class="element-btn" data-add="label">
        <span class="icon">📝</span>
        <span>Текст</span>
      </button>
      <button type="button" class="element-btn" data-add="shape">
        <span class="icon">⬛</span>
        <span>Фигура</span>
      </button>
      <button type="button" class="element-btn" data-add="line">
        <span class="icon">➖</span>
        <span>Линия</span>
      </button>
      <button type="button" class="element-btn" data-add="timer">
        <span class="icon">⏱️</span>
        <span>Таймер</span>
      </button>
      <button type="button" class="element-btn" data-add="social">
        <span class="icon">📱</span>
        <span>Соцсети</span>
      </button>
    </div>

    <div class="panel-title" style="margin-top: 10px;">Слои</div>
    <div class="layers-list" id="layersList"></div>
  </div>

  <!-- ЦЕНТР -->
  <div class="editor">
    <div class="editor-toolbar">
      <div class="toolbar-group">
        <button type="button" class="icon-btn" id="btnZoomOut" title="Уменьшить">−</button>
        <div class="zoom-display" id="zoomDisplay">100%</div>
        <button type="button" class="icon-btn" id="btnZoomIn" title="Увеличить">+</button>
        <button type="button" class="icon-btn" id="btnFit" title="По размеру">⤢</button>
      </div>
      <div class="toolbar-group">
        <button type="button" class="icon-btn" id="btnCenter" title="Центрировать">⊙</button>
        <button type="button" class="icon-btn" id="btnGrid" title="Сетка">⋮⋮</button>
        <button type="button" class="icon-btn" id="btnSafe" title="Safe-зона">▢</button>
      </div>
      <div class="toolbar-group">
        <button type="button" class="icon-btn" id="btnDup" title="Дублировать">⧉</button>
        <button type="button" class="icon-btn" id="btnDelete" title="Удалить">🗑</button>
      </div>
      <div class="toolbar-group" style="margin-left: auto;">
        <span style="font-size: 0.72rem; color: var(--text-mute); font-family: 'JetBrains Mono', monospace;" id="canvasInfo">1920 × 1080</span>
      </div>
    </div>

    <div class="canvas-area" id="canvasArea">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="overlayCanvas" width="1920" height="1080"></canvas>
      </div>
    </div>
  </div>

  <!-- ПРАВАЯ ПАНЕЛЬ -->
  <div class="panel properties" id="propertiesPanel">
    <div class="empty-state" id="emptyState">
      <span class="big">🎨</span>
      <span>Выбери элемент, чтобы настроить</span>
      <span style="font-size: 0.7rem; color: var(--text-mute);">или добавь новый слева</span>
    </div>
    <div id="propsContent" style="display: none;"></div>
  </div>

</div>

<div id="status"></div>

<script>
/* ============================================================
   OverlayForge — конструктор оверлеев
   ============================================================ */

// ============ СОСТОЯНИЕ ============

const state = {
  canvas: { width: 1920, height: 1080 },
  elements: [],
  selectedId: null,
  zoom: 1,
  showGrid: true,
  showSafe: true,
};

const history = { stack: [], index: -1, limit: 30 };

let uid = 0;
const nextId = () => ++uid;

// ============ ТИПЫ ЭЛЕМЕНТОВ ============

const ELEMENT_TYPES = {
  webcam: {
    icon: '📹',
    name: 'Веб-камера',
    create: () => ({
      type: 'webcam',
      label: 'Webcam',
      x: 60, y: 60, w: 480, h: 270,
      radius: 16,
      fill: '#1e1e2e',
      stroke: { enabled: true, width: 4, color: '#9147ff' },
      labelStyle: { enabled: true, text: 'Webcam', color: '#ffffff', size: 16, pos: 'inside' },
    }),
  },
  chat: {
    icon: '💬',
    name: 'Чат',
    create: () => ({
      type: 'chat',
      label: 'Chat',
      x: 1480, y: 60, w: 380, h: 600,
      radius: 12,
      fill: 'rgba(10, 10, 18, 0.7)',
      stroke: { enabled: true, width: 2, color: '#9147ff' },
      labelStyle: { enabled: true, text: 'CHAT', color: '#ffffff', size: 14, pos: 'top' },
    }),
  },
  alert: {
    icon: '🔔',
    name: 'Алерт',
    create: () => ({
      type: 'alert',
      label: 'Alert',
      x: 760, y: 400, w: 400, h: 120,
      radius: 20,
      fill: 'rgba(145, 71, 255, 0.85)',
      stroke: { enabled: false, width: 2, color: '#ffffff' },
      labelStyle: { enabled: true, text: 'NEW FOLLOWER!', color: '#ffffff', size: 22, pos: 'inside' },
    }),
  },
  goal: {
    icon: '🎯',
    name: 'Цель',
    create: () => ({
      type: 'goal',
      label: 'Goal',
      x: 760, y: 950, w: 400, h: 60,
      radius: 12,
      fill: 'rgba(30, 30, 46, 0.9)',
      progress: 0.65,
      progressColor: '#9147ff',
      stroke: { enabled: true, width: 2, color: '#9147ff' },
      labelStyle: { enabled: true, text: 'SUB GOAL — 65/100', color: '#ffffff', size: 14, pos: 'inside' },
    }),
  },
  counter: {
    icon: '🔢',
    name: 'Счётчик',
    create: () => ({
      type: 'counter',
      label: 'Counter',
      x: 60, y: 950, w: 200, h: 80,
      radius: 14,
      fill: 'rgba(30, 30, 46, 0.9)',
      stroke: { enabled: true, width: 2, color: '#4ade80' },
      labelStyle: { enabled: true, text: '42', color: '#4ade80', size: 42, pos: 'inside' },
    }),
  },
  label: {
    icon: '📝',
    name: 'Текст',
    create: () => ({
      type: 'label',
      label: 'Text',
      x: 760, y: 30, w: 400, h: 60,
      radius: 0,
      fill: 'transparent',
      stroke: { enabled: false, width: 0, color: '#ffffff' },
      labelStyle: { enabled: true, text: 'STREAM TITLE HERE', color: '#ffffff', size: 28, pos: 'inside' },
    }),
  },
  shape: {
    icon: '⬛',
    name: 'Фигура',
    create: () => ({
      type: 'shape',
      label: 'Shape',
      x: 400, y: 300, w: 300, h: 300,
      shape: 'rectangle',
      radius: 16,
      fill: 'rgba(145, 71, 255, 0.3)',
      stroke: { enabled: true, width: 3, color: '#9147ff' },
      labelStyle: { enabled: false, text: '', color: '#ffffff', size: 16, pos: 'inside' },
    }),
  },
  line: {
    icon: '➖',
    name: 'Линия',
    create: () => ({
      type: 'line',
      label: 'Line',
      x: 400, y: 500, w: 400, h: 4,
      fill: '#9147ff',
      radius: 0,
      stroke: { enabled: false, width: 0, color: '#ffffff' },
      labelStyle: { enabled: false, text: '', color: '#ffffff', size: 14, pos: 'inside' },
    }),
  },
  timer: {
    icon: '⏱️',
    name: 'Таймер',
    create: () => ({
      type: 'timer',
      label: 'Timer',
      x: 760, y: 30, w: 400, h: 100,
      radius: 12,
      fill: 'rgba(30, 30, 46, 0.9)',
      stroke: { enabled: true, width: 2, color: '#fbbf24' },
      labelStyle: { enabled: true, text: '05:00', color: '#fbbf24', size: 56, pos: 'inside' },
    }),
  },
  social: {
    icon: '📱',
    name: 'Соцсети',
    create: () => ({
      type: 'social',
      label: 'Social',
      x: 60, y: 1000, w: 400, h: 40,
      radius: 0,
      fill: 'transparent',
      stroke: { enabled: false, width: 0, color: '#ffffff' },
      labelStyle: { enabled: true, text: '@yourname · twitch.tv/you', color: '#ffffff', size: 18, pos: 'inside' },
    }),
  },
};

// ============ CANVAS ============

const canvas = document.getElementById('overlayCanvas');
const ctx = canvas.getContext('2d');
const canvasWrap = document.getElementById('canvasWrap');
const canvasArea = document.getElementById('canvasArea');
const layersList = document.getElementById('layersList');
const propsContent = document.getElementById('propsContent');
const emptyState = document.getElementById('emptyState');
const zoomDisplay = document.getElementById('zoomDisplay');
const canvasInfo = document.getElementById('canvasInfo');

// ============ СТАТУС ============

let statusTimeout;
function setStatus(text, type = 'info') {
  const el = document.getElementById('status');
  el.textContent = text || '';
  el.classList.remove('success', 'error');
  el.classList.toggle('visible', !!text);
  if (type === 'success') el.classList.add('success');
  if (type === 'error') el.classList.add('error');
  clearTimeout(statusTimeout);
  if (text) {
    statusTimeout = setTimeout(() => {
      el.classList.remove('visible');
    }, 2500);
  }
}

// ============ ИСТОРИЯ ============

function snapshot() {
  return JSON.parse(JSON.stringify({
    canvas: state.canvas,
    elements: state.elements.map(e => ({ ...e })),
  }));
}

function pushHistory() {
  const snap = snapshot();
  const last = history.stack[history.index];
  if (last && JSON.stringify(last) === JSON.stringify(snap)) return;
  history.stack = history.stack.slice(0, history.index + 1);
  history.stack.push(snap);
  if (history.stack.length > history.limit) history.stack.shift();
  history.index = history.stack.length - 1;
  updateHistoryButtons();
}

function undo() {
  if (history.index <= 0) return;
  history.index--;
  applySnapshot(history.stack[history.index]);
  updateHistoryButtons();
  setStatus('Отменено');
}

function redo() {
  if (history.index >= history.stack.length - 1) return;
  history.index++;
  applySnapshot(history.stack[history.index]);
  updateHistoryButtons();
  setStatus('Повторено');
}

function applySnapshot(snap) {
  state.canvas = { ...snap.canvas };
  state.elements = snap.elements.map(e => ({ ...e }));
  if (!state.elements.find(e => e.id === state.selectedId)) {
    state.selectedId = null;
  }
  canvas.width = state.canvas.width;
  canvas.height = state.canvas.height;
  canvasInfo.textContent = `${state.canvas.width} × ${state.canvas.height}`;
  renderAll();
}

function updateHistoryButtons() {
  document.getElementById('btnUndo').disabled = history.index <= 0;
  document.getElementById('btnRedo').disabled = history.index >= history.stack.length - 1;
}

// ============ РИСОВАНИЕ ============

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Сетка
  if (state.showGrid) {
    drawGrid();
  }

  // Элементы
  state.elements.forEach(el => drawElement(el));

  // Safe-зона
  if (state.showSafe) {
    drawSafeZone();
  }

  // Выделение выбранного
  const sel = state.elements.find(e => e.id === state.selectedId);
  if (sel) {
    drawSelection(sel);
  }
}

function drawGrid() {
  const step = 100;
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= canvas.width; x += step) {
    ctx.moveTo(x + 0.5, 0);
    ctx.lineTo(x + 0.5, canvas.height);
  }
  for (let y = 0; y <= canvas.height; y += step) {
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(canvas.width, y + 0.5);
  }
  ctx.stroke();

  // Центральные оси
  ctx.strokeStyle = 'rgba(145, 71, 255, 0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.moveTo(0, canvas.height / 2);
  ctx.lineTo(canvas.width, canvas.height / 2);
  ctx.stroke();
  ctx.restore();
}

function drawSafeZone() {
  const padding = Math.round(canvas.width * 0.05);
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 200, 0, 0.2)';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 10]);
  ctx.strokeRect(padding, padding, canvas.width - padding * 2, canvas.height - padding * 2);
  ctx.setLineDash([]);
  ctx.restore();
}

function drawElement(el) {
  ctx.save();

  if (el.type === 'line') {
    ctx.fillStyle = el.fill;
    ctx.fillRect(el.x, el.y, el.w, el.h);
    drawLabel(el);
    ctx.restore();
    return;
  }

  if (el.type === 'label' || el.type === 'social') {
    drawLabel(el);
    ctx.restore();
    return;
  }

  // Форма с закруглением
  if (el.radius > 0) {
    roundRect(ctx, el.x, el.y, el.w, el.h, el.radius);
  } else {
    ctx.beginPath();
    ctx.rect(el.x, el.y, el.w, el.h);
  }

  // Заливка
  if (el.fill && el.fill !== 'transparent') {
    ctx.fillStyle = el.fill;
    ctx.fill();
  }

  // Прогресс для цели
  if (el.type === 'goal' && typeof el.progress === 'number') {
    ctx.save();
    ctx.clip();
    ctx.fillStyle = el.progressColor || '#9147ff';
    ctx.fillRect(el.x, el.y, el.w * el.progress, el.h);
    ctx.restore();
  }

  // Специфика типов
  if (el.type === 'webcam') {
    // Заглушка вебки
    ctx.save();
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = '#000';
    ctx.fillRect(el.x + el.stroke.width, el.y + el.stroke.width, el.w - el.stroke.width * 2, el.h - el.stroke.width * 2);
    ctx.restore();
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.font = `600 ${Math.round(el.h * 0.08)}px Inter, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('📹 WEBCAM', el.x + el.w / 2, el.y + el.h / 2);
    ctx.restore();
  }

  if (el.type === 'chat') {
    // Заглушка чата
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.font = `500 14px Inter, sans-serif`;
    ctx.textBaseline = 'top';
    const lines = [
      { name: 'user123', text: 'Hello streamer!', color: '#4ade80' },
      { name: 'viewer_42', text: 'LUL', color: '#fbbf24' },
      { name: 'moderator', text: 'Welcome!', color: '#ff5c8a' },
      { name: 'fan_2024', text: 'PogChamp', color: '#38bdf8' },
    ];
    lines.forEach((line, i) => {
      const y = el.y + 50 + i * 28;
      if (y > el.y + el.h - 20) return;
      ctx.fillStyle = line.color;
      ctx.font = `700 13px Inter, sans-serif`;
      ctx.fillText(line.name + ':', el.x + 14, y);
      const nameWidth = ctx.measureText(line.name + ': ').width;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.font = `400 13px Inter, sans-serif`;
      ctx.fillText(line.text, el.x + 14 + nameWidth, y);
    });
    ctx.restore();
  }

  if (el.type === 'alert') {
    // Пульсирующая подсветка
    ctx.save();
    const grad = ctx.createLinearGradient(el.x, el.y, el.x, el.y + el.h);
    grad.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(el.x, el.y, el.w, el.h);
    ctx.restore();
  }

  if (el.type === 'timer') {
    // Моноширинный таймер
    // уже через labelStyle
  }

  // Обводка
  if (el.stroke && el.stroke.enabled && el.stroke.width > 0) {
    if (el.radius > 0) {
      roundRect(ctx, el.x, el.y, el.w, el.h, el.radius);
    } else {
      ctx.beginPath();
      ctx.rect(el.x, el.y, el.w, el.h);
    }
    ctx.strokeStyle = el.stroke.color;
    ctx.lineWidth = el.stroke.width;
    ctx.stroke();
  }

  // Метка
  drawLabel(el);

  ctx.restore();
}

function drawLabel(el) {
  if (!el.labelStyle || !el.labelStyle.enabled || !el.labelStyle.text) return;

  const style = el.labelStyle;
  ctx.save();
  ctx.fillStyle = style.color;
  const isTimer = el.type === 'timer';
  const isCounter = el.type === 'counter';
  const font = isTimer || isCounter
    ? `800 ${style.size}px 'JetBrains Mono', monospace`
    : `700 ${style.size}px Inter, sans-serif`;
  ctx.font = font;
  ctx.textBaseline = 'middle';

  let x, y, align;
  if (style.pos === 'inside') {
    x = el.x + el.w / 2;
    y = el.y + el.h / 2;
    align = 'center';
  } else if (style.pos === 'top') {
    x = el.x + el.w / 2;
    y = el.y + style.size;
    align = 'center';
  } else if (style.pos === 'bottom') {
    x = el.x + el.w / 2;
    y = el.y + el.h - style.size / 2;
    align = 'center';
  } else {
    x = el.x + el.w / 2;
    y = el.y + el.h / 2;
    align = 'center';
  }

  ctx.textAlign = align;

  // Тень для читаемости
  ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 1;
  ctx.fillText(style.text, x, y);
  ctx.restore();
}

function drawSelection(el) {
  ctx.save();
  ctx.strokeStyle = '#9147ff';
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 4]);
  ctx.strokeRect(el.x - 2, el.y - 2, el.w + 4, el.h + 4);
  ctx.setLineDash([]);

  // Углы
  const corners = [
    [el.x - 4, el.y - 4],
    [el.x + el.w - 4, el.y - 4],
    [el.x - 4, el.y + el.h - 4],
    [el.x + el.w - 4, el.y + el.h - 4],
  ];
  ctx.fillStyle = '#9147ff';
  corners.forEach(([x, y]) => {
    ctx.fillRect(x, y, 10, 10);
  });
  ctx.restore();
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

// ============ РЕНДЕР UI ============

function renderAll() {
  draw();
  renderLayers();
  renderProperties();
}

function renderLayers() {
  layersList.innerHTML = '';
  if (!state.elements.length) {
    const empty = document.createElement('div');
    empty.style.cssText = 'padding: 12px; font-size: 0.72rem; color: var(--text-mute); text-align: center;';
    empty.textContent = 'Пока пусто';
    layersList.appendChild(empty);
    return;
  }
  // Слои в обратном порядке (верхние сверху)
  [...state.elements].reverse().forEach(el => {
    const item = document.createElement('div');
    item.className = 'layer-item' + (el.id === state.selectedId ? ' active' : '');
    item.innerHTML = `<span class="layer-icon">${ELEMENT_TYPES[el.type]?.icon || '▪'}</span><span class="layer-name">${el.label || el.type}</span>`;
    item.addEventListener('click', () => {
      state.selectedId = el.id;
      renderAll();
    });

    const vis = document.createElement('button');
    vis.type = 'button';
    vis.className = 'layer-vis';
    vis.textContent = el.hidden ? '◌' : '◉';
    vis.title = el.hidden ? 'Показать' : 'Скрыть';
    vis.addEventListener('click', (e) => {
      e.stopPropagation();
      el.hidden = !el.hidden;
      renderAll();
      pushHistory();
    });

    item.appendChild(vis);
    layersList.appendChild(item);
  });
}

function renderProperties() {
  const el = state.elements.find(e => e.id === state.selectedId);
  if (!el) {
    emptyState.style.display = 'flex';
    propsContent.style.display = 'none';
    return;
  }
  emptyState.style.display = 'none';
  propsContent.style.display = 'block';

  const typeInfo = ELEMENT_TYPES[el.type];

  let html = '';

  // Заголовок
  html += `<div class="prop-section" style="padding-top: 0;">
    <div class="prop-title">${typeInfo?.icon || ''} ${typeInfo?.name || el.type}</div>
    <input type="text" class="text-input" id="propLabel" value="${escapeAttr(el.label || '')}" placeholder="Название слоя">
  </div>`;

  // Позиция и размер
  html += `<div class="prop-section">
    <div class="prop-title">Позиция и размер</div>
    <div class="slider-row">
      <div class="slider-label"><span>X</span><span class="val" id="valX">${el.x}</span></div>
      <input type="range" id="propX" min="0" max="${state.canvas.width}" value="${el.x}">
    </div>
    <div class="slider-row">
      <div class="slider-label"><span>Y</span><span class="val" id="valY">${el.y}</span></div>
      <input type="range" id="propY" min="0" max="${state.canvas.height}" value="${el.y}">
    </div>
    <div class="slider-row">
      <div class="slider-label"><span>Ширина</span><span class="val" id="valW">${el.w}</span></div>
      <input type="range" id="propW" min="20" max="${state.canvas.width}" value="${el.w}">
    </div>
    <div class="slider-row">
      <div class="slider-label"><span>Высота</span><span class="val" id="valH">${el.h}</span></div>
      <input type="range" id="propH" min="4" max="${state.canvas.height}" value="${el.h}">
    </div>
  </div>`;

  // Скругление
  if (el.type !== 'line' && el.type !== 'label' && el.type !== 'social') {
    html += `<div class="prop-section">
      <div class="prop-title">Скругление</div>
      <div class="slider-row">
        <div class="slider-label"><span>Радиус</span><span class="val" id="valR">${el.radius || 0}</span></div>
        <input type="range" id="propR" min="0" max="100" value="${el.radius || 0}">
      </div>
    </div>`;
  }

  // Заливка
  if (el.type !== 'label' && el.type !== 'social' && el.type !== 'line') {
    html += `<div class="prop-section">
      <div class="prop-title">Заливка</div>
      <div class="color-row">
        <label for="propFill">Цвет</label>
        <input type="color" id="propFill" value="${rgbaToHex(el.fill)}">
      </div>
      <div class="slider-row">
        <div class="slider-label"><span>Прозрачность</span><span class="val" id="valFillA">${Math.round(getAlpha(el.fill) * 100)}%</span></div>
        <input type="range" id="propFillA" min="0" max="100" value="${Math.round(getAlpha(el.fill) * 100)}">
      </div>
    </div>`;
  }

  // Прогресс для цели
  if (el.type === 'goal') {
    html += `<div class="prop-section">
      <div class="prop-title">Прогресс</div>
      <div class="slider-row">
        <div class="slider-label"><span>Значение</span><span class="val" id="valProgress">${Math.round(el.progress * 100)}%</span></div>
        <input type="range" id="propProgress" min="0" max="100" value="${Math.round(el.progress * 100)}">
      </div>
      <div class="color-row">
        <label for="propProgressColor">Цвет прогресса</label>
        <input type="color" id="propProgressColor" value="${el.progressColor || '#9147ff'}">
      </div>
    </div>`;
  }

  // Обводка
  html += `<div class="prop-section">
    <div class="prop-title">Обводка</div>
    <div class="toggle-row">
      <div class="toggle-label"><span>Включить</span></div>
      <label class="switch">
        <input type="checkbox" id="propStroke" ${el.stroke?.enabled ? 'checked' : ''}>
        <span class="switch-slider"></span>
      </label>
    </div>
    <div class="slider-row">
      <div class="slider-label"><span>Толщина</span><span class="val" id="valStrokeW">${el.stroke?.width || 0} px</span></div>
      <input type="range" id="propStrokeW" min="1" max="20" value="${el.stroke?.width || 2}">
    </div>
    <div class="color-row">
      <label for="propStrokeColor">Цвет</label>
      <input type="color" id="propStrokeColor" value="${el.stroke?.color || '#9147ff'}">
    </div>
  </div>`;

  // Текст
  html += `<div class="prop-section">
    <div class="prop-title">Текст</div>
    <div class="toggle-row">
      <div class="toggle-label"><span>Показывать</span></div>
      <label class="switch">
        <input type="checkbox" id="propLabelEnabled" ${el.labelStyle?.enabled ? 'checked' : ''}>
        <span class="switch-slider"></span>
      </label>
    </div>
    <input type="text" class="text-input" id="propLabelText" value="${escapeAttr(el.labelStyle?.text || '')}" placeholder="Текст">
    <div class="color-row">
      <label for="propLabelColor">Цвет</label>
      <input type="color" id="propLabelColor" value="${el.labelStyle?.color || '#ffffff'}">
    </div>
    <div class="slider-row">
      <div class="slider-label"><span>Размер</span><span class="val" id="valLabelSize">${el.labelStyle?.size || 16} px</span></div>
      <input type="range" id="propLabelSize" min="8" max="120" value="${el.labelStyle?.size || 16}">
    </div>
  </div>`;

  // Действия
  html += `<div class="prop-section">
    <div class="prop-title">Действия</div>
    <button type="button" class="btn" id="propDup" style="width: 100%; justify-content: center; margin-bottom: 6px;">⧉ Дублировать</button>
    <button type="button" class="btn" id="propUp" style="width: 100%; justify-content: center; margin-bottom: 6px;">↑ На передний план</button>
    <button type="button" class="btn" id="propDelete" style="width: 100%; justify-content: center; color: #ff8fa3;">🗑 Удалить</button>
  </div>`;

  propsContent.innerHTML = html;

  // Привязка обработчиков
  document.getElementById('propLabel').addEventListener('input', (e) => { el.label = e.target.value; renderLayers(); });
  document.getElementById('propLabel').addEventListener('change', () => pushHistory());

  bindSlider('propX', 'valX', (v) => { el.x = v; draw(); });
  bindSlider('propY', 'valY', (v) => { el.y = v; draw(); });
  bindSlider('propW', 'valW', (v) => { el.w = v; draw(); });
  bindSlider('propH', 'valH', (v) => { el.h = v; draw(); });
  if (document.getElementById('propR')) bindSlider('propR', 'valR', (v) => { el.radius = v; draw(); });

  if (document.getElementById('propFill')) {
    document.getElementById('propFill').addEventListener('input', (e) => {
      const hex = e.target.value;
      const a = getAlpha(el.fill);
      el.fill = hexToRgba(hex, a);
      draw();
    });
    document.getElementById('propFill').addEventListener('change', pushHistory);
    bindSlider('propFillA', 'valFillA', (v) => {
      const hex = rgbaToHex(el.fill);
      el.fill = hexToRgba(hex, v / 100);
      draw();
    }, '%');
  }

  if (document.getElementById('propProgress')) {
    bindSlider('propProgress', 'valProgress', (v) => { el.progress = v / 100; draw(); }, '%');
    document.getElementById('propProgressColor').addEventListener('input', (e) => { el.progressColor = e.target.value; draw(); });
    document.getElementById('propProgressColor').addEventListener('change', pushHistory);
  }

  document.getElementById('propStroke').addEventListener('change', (e) => { el.stroke.enabled = e.target.checked; draw(); pushHistory(); });
  bindSlider('propStrokeW', 'valStrokeW', (v) => { el.stroke.width = v; draw(); }, ' px');
  document.getElementById('propStrokeColor').addEventListener('input', (e) => { el.stroke.color = e.target.value; draw(); });
  document.getElementById('propStrokeColor').addEventListener('change', pushHistory);

  document.getElementById('propLabelEnabled').addEventListener('change', (e) => { el.labelStyle.enabled = e.target.checked; draw(); pushHistory(); });
  document.getElementById('propLabelText').addEventListener('input', (e) => { el.labelStyle.text = e.target.value; draw(); });
  document.getElementById('propLabelText').addEventListener('change', pushHistory);
  document.getElementById('propLabelColor').addEventListener('input', (e) => { el.labelStyle.color = e.target.value; draw(); });
  document.getElementById('propLabelColor').addEventListener('change', pushHistory);
  bindSlider('propLabelSize', 'valLabelSize', (v) => { el.labelStyle.size = v; draw(); }, ' px');

  document.getElementById('propDup').addEventListener('click', () => duplicateElement(el.id));
  document.getElementById('propUp').addEventListener('click', () => bringToFront(el.id));
  document.getElementById('propDelete').addEventListener('click', () => deleteElement(el.id));
}

function bindSlider(sliderId, labelId, onChange, suffix = '') {
  const slider = document.getElementById(sliderId);
  const label = document.getElementById(labelId);
  if (!slider || !label) return;
  slider.addEventListener('input', (e) => {
    const v = +e.target.value;
    label.textContent = v + suffix;
    onChange(v);
  });
  slider.addEventListener('change', pushHistory);
}

// ============ ЦВЕТА ============

function hexToRgba(hex, alpha = 1) {
  if (!hex || hex === 'transparent') return `rgba(0, 0, 0, 0)`;
  if (hex.startsWith('rgba') || hex.startsWith('rgb')) {
    return hex;
  }
  const num = parseInt(hex.replace('#', ''), 16);
  const r = (num >> 16) & 255;
  const g = (num >> 8) & 255;
  const b = num & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function rgbaToHex(color) {
  if (!color || color === 'transparent') return '#000000';
  if (color.startsWith('#')) return color;
  const m = color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (!m) return '#000000';
  const r = +m[1], g = +m[2], b = +m[3];
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

function getAlpha(color) {
  if (!color || color === 'transparent') return 0;
  if (color.startsWith('#')) return 1;
  const m = color.match(/rgba\([^,]+,[^,]+,[^,]+,\s*([\d.]+)\)/);
  return m ? parseFloat(m[1]) : 1;
}

function escapeAttr(str) {
  return String(str).replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ============ ДЕЙСТВИЯ С ЭЛЕМЕНТАМИ ============

function addElement(type) {
  const def = ELEMENT_TYPES[type];
  if (!def) return;
  const el = { id: nextId(), ...def.create(), hidden: false };
  state.elements.push(el);
  state.selectedId = el.id;
  renderAll();
  pushHistory();
  setStatus(`Добавлено: ${def.name}`, 'success');
}

function deleteElement(id) {
  const idx = state.elements.findIndex(e => e.id === id);
  if (idx === -1) return;
  state.elements.splice(idx, 1);
  if (state.selectedId === id) state.selectedId = null;
  renderAll();
  pushHistory();
  setStatus('Удалено');
}

function duplicateElement(id) {
  const el = state.elements.find(e => e.id === id);
  if (!el) return;
  const copy = JSON.parse(JSON.stringify(el));
  copy.id = nextId();
  copy.x += 30;
  copy.y += 30;
  copy.label = (copy.label || 'Copy') + ' copy';
  state.elements.push(copy);
  state.selectedId = copy.id;
  renderAll();
  pushHistory();
  setStatus('Дублировано', 'success');
}

function bringToFront(id) {
  const idx = state.elements.findIndex(e => e.id === id);
  if (idx === -1 || idx === state.elements.length - 1) return;
  const [el] = state.elements.splice(idx, 1);
  state.elements.push(el);
  renderAll();
  pushHistory();
}

// ============ МАСШТАБ ============

function setZoom(z) {
  state.zoom = Math.max(0.1, Math.min(3, z));
  canvasWrap.style.transform = `scale(${state.zoom})`;
  zoomDisplay.textContent = Math.round(state.zoom * 100) + '%';
}

function fitZoom() {
  const areaRect = canvasArea.getBoundingClientRect();
  const padding = 60;
  const zx = (areaRect.width - padding) / canvas.width;
  const zy = (areaRect.height - padding) / canvas.height;
  setZoom(Math.min(zx, zy, 1));
}

// ============ ЭКСПОРТ ============

function downloadPng() {
  // Сохраняем текущий стейт сетки
  const wasGrid = state.showGrid;
  const wasSafe = state.showSafe;
  state.showGrid = false;
  state.showSafe = false;
  draw();

  canvas.toBlob((blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `overlay-${state.canvas.width}x${state.canvas.height}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    setStatus('PNG скачан', 'success');

    state.showGrid = wasGrid;
    state.showSafe = wasSafe;
    draw();
  }, 'image/png');
}

function exportJson() {
  const data = snapshot();
  data.selectedId = null;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'overlay-project.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  setStatus('Проект сохранён', 'success');
}

function importJson() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data.elements || !Array.isArray(data.elements)) {
          throw new Error('Неверный формат');
        }
        // Присваиваем новые ID элементам без id
        data.elements.forEach(el => {
          if (!el.id) el.id = nextId();
          else {
            const n = +el.id;
            if (n > uid) uid = n;
          }
        });
        state.canvas = data.canvas || state.canvas;
        state.elements = data.elements;
        state.selectedId = null;
        canvas.width = state.canvas.width;
        canvas.height = state.canvas.height;
        canvasInfo.textContent = `${state.canvas.width} × ${state.canvas.height}`;
        renderAll();
        pushHistory();
        setStatus('Проект загружен', 'success');
      } catch (err) {
        console.error(err);
        setStatus('Ошибка загрузки проекта', 'error');
      }
    };
    reader.readAsText(file);
  });
  input.click();
}

// ============ СОБЫТИЯ ============

// Добавление элементов
document.querySelectorAll('[data-add]').forEach(btn => {
  btn.addEventListener('click', () => addElement(btn.dataset.add));
});

// Кнопки шапки
document.getElementById('btnUndo').addEventListener('click', undo);
document.getElementById('btnRedo').addEventListener('click', redo);
document.getElementById('btnDownload').addEventListener('click', downloadPng);
document.getElementById('btnExport').addEventListener('click', exportJson);
document.getElementById('btnImport').addEventListener('click', importJson);

// Toolbar
document.getElementById('btnZoomIn').addEventListener('click', () => setZoom(state.zoom + 0.1));
document.getElementById('btnZoomOut').addEventListener('click', () => setZoom(state.zoom - 0.1));
document.getElementById('btnFit').addEventListener('click', fitZoom);
document.getElementById('btnCenter').addEventListener('click', () => {
  setZoom(1);
  canvasArea.scrollTo({ left: 0, top: 0, behavior: 'smooth' });
});

const btnGrid = document.getElementById('btnGrid');
btnGrid.classList.toggle('active', state.showGrid);
btnGrid.addEventListener('click', () => {
  state.showGrid = !state.showGrid;
  btnGrid.classList.toggle('active', state.showGrid);
  draw();
});

const btnSafe = document.getElementById('btnSafe');
btnSafe.classList.toggle('active', state.showSafe);
btnSafe.addEventListener('click', () => {
  state.showSafe = !state.showSafe;
  btnSafe.classList.toggle('active', state.showSafe);
  draw();
});

document.getElementById('btnDup').addEventListener('click', () => {
  if (state.selectedId) duplicateElement(state.selectedId);
});
document.getElementById('btnDelete').addEventListener('click', () => {
  if (state.selectedId) deleteElement(state.selectedId);
});

// Горячие клавиши
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
    if (e.ctrlKey && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    if (e.ctrlKey && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
    return;
  }

  if (e.ctrlKey && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if (e.ctrlKey && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }
  if (e.ctrlKey && e.key === 'd') { e.preventDefault(); if (state.selectedId) duplicateElement(state.selectedId); return; }
  if (e.ctrlKey) return;

  if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedId) {
    e.preventDefault();
    deleteElement(state.selectedId);
  }
  if (e.key === 'Escape') {
    state.selectedId = null;
    renderAll();
  }

  // Стрелки для перемещения
  if (state.selectedId && e.key.startsWith('Arrow')) {
    const el = state.elements.find(x => x.id === state.selectedId);
    if (!el) return;
    e.preventDefault();
    const step = e.shiftKey ? 20 : 2;
    if (e.key === 'ArrowLeft') el.x -= step;
    if (e.key === 'ArrowRight') el.x += step;
    if (e.key === 'ArrowUp') el.y -= step;
    if (e.key === 'ArrowDown') el.y += step;
    draw();
    renderProperties();
  }
});

document.addEventListener('keyup', (e) => {
  if (e.key.startsWith('Arrow') && state.selectedId) {
    pushHistory();
  }
});

// Ресайз окна
window.addEventListener('resize', () => {
  if (window.innerWidth < 900) {
    setZoom(1);
  }
});

// ============ CANVAS КЛИКИ ============

function canvasToLocal(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / state.zoom,
    y: (clientY - rect.top) / state.zoom,
  };
}

function hitTest(x, y) {
  // Проверяем сверху вниз
  for (let i = state.elements.length - 1; i >= 0; i--) {
    const el = state.elements[i];
    if (el.hidden) continue;
    if (x >= el.x && x <= el.x + el.w && y >= el.y && y <= el.y + el.h) {
      return el;
    }
  }
  return null;
}

canvas.addEventListener('mousedown', (e) => {
  const pt = canvasToLocal(e.clientX, e.clientY);
  const hit = hitTest(pt.x, pt.y);

  if (hit) {
    state.selectedId = hit.id;
    renderAll();

    // Начинаем перетаскивание
    const startX = pt.x;
    const startY = pt.y;
    const origX = hit.x;
    const origY = hit.y;
    let moved = false;

    const onMove = (ev) => {
      const p = canvasToLocal(ev.clientX, ev.clientY);
      const dx = p.x - startX;
      const dy = p.y - startY;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
      hit.x = Math.max(-hit.w + 20, Math.min(state.canvas.width - 20, origX + dx));
      hit.y = Math.max(-hit.h + 20, Math.min(state.canvas.height - 20, origY + dy));
      hit.x = Math.round(hit.x);
      hit.y = Math.round(hit.y);
      draw();
      renderProperties();
    };

    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if (moved) pushHistory();
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  } else {
    state.selectedId = null;
    renderAll();
  }
});

// Touch-перетаскивание
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  const touch = e.touches[0];
  const pt = canvasToLocal(touch.clientX, touch.clientY);
  const hit = hitTest(pt.x, pt.y);
  if (!hit) {
    state.selectedId = null;
    renderAll();
    return;
  }
  e.preventDefault();
  state.selectedId = hit.id;
  renderAll();

  const startX = pt.x;
  const startY = pt.y;
  const origX = hit.x;
  const origY = hit.y;
  let moved = false;

  const onMove = (ev) => {
    if (ev.touches.length !== 1) return;
    const t = ev.touches[0];
    const p = canvasToLocal(t.clientX, t.clientY);
    const dx = p.x - startX;
    const dy = p.y - startY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
    hit.x = Math.max(-hit.w + 20, Math.min(state.canvas.width - 20, Math.round(origX + dx)));
    hit.y = Math.max(-hit.h + 20, Math.min(state.canvas.height - 20, Math.round(origY + dy)));
    draw();
    renderProperties();
  };

  const onEnd = () => {
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
    if (moved) pushHistory();
  };

  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('touchend', onEnd);
}, { passive: false });

// ============ СТАРТ ============

canvas.width = state.canvas.width;
canvas.height = state.canvas.height;
canvasInfo.textContent = `${state.canvas.width} × ${state.canvas.height}`;

renderAll();
pushHistory();

// Автоподгон масштаба на старте
setTimeout(() => {
  if (window.innerWidth >= 900) fitZoom();
}, 100);

</script>
